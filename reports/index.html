<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Constructor Performance Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .card {
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .chart-container {
            position: relative;
            height: 350px;
            width: 100%;
        }

        /* Floating buttons on chart */
        .chart-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
            display: flex;
            gap: 5px;
        }

        .btn-chart-action {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ccc;
            padding: 2px 8px;
            font-size: 12px;
        }

        .btn-chart-action:hover {
            background: #eee;
        }

        .btn-primary {
            background-color: #e10600;
            border-color: #e10600;
        }

        .dashboard-panel {
            border: 1px solid #ddd;
            padding: 15px;
            background: white;
            border-radius: 8px;
            height: 100%;
        }

        #comparison-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .compare-slot {
            flex: 1;
            min-width: 45%;
        }

        @media (max-width: 1200px) {
            .compare-slot {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1"><i class="fas fa-flag-checkered me-2"></i>F1 Constructor Performance Tracker</span>
        <div class="d-flex" role="group">
            <button class="btn btn-outline-light me-2 active" id="btn-view-single" onclick="switchView('single')">
                Analysis
            </button>
            <button class="btn btn-outline-light me-2" id="btn-view-compare" onclick="switchView('compare')">Compare
            </button>
            <button class="btn btn-outline-light" id="btn-view-history" onclick="switchView('history')">History</button>
        </div>
    </div>
</nav>

<div class="container-fluid px-4">
    <div id="loading" class="text-center my-5">
        <div class="spinner-border text-danger" role="status"></div>
        <p class="mt-2">Loading F1 Data...</p>
        <p class="text-muted small">Ensure 'f1_data.csv' is in the folder and local server is running.</p>
    </div>

    <div id="view-single" class="view-section">
        <div class="row" id="single-panel-container"></div>
    </div>

    <div id="view-compare" class="view-section d-none">
        <div class="row mb-3 text-center">
            <div class="col">
                <label class="fw-bold me-2">Comparisons:</label>
                <div class="btn-group">
                    <button class="btn btn-outline-secondary" onclick="setCompareCount(2)">2</button>
                    <button class="btn btn-outline-secondary" onclick="setCompareCount(3)">3</button>
                    <button class="btn btn-outline-secondary" onclick="setCompareCount(4)">4</button>
                </div>
            </div>
        </div>
        <div id="comparison-grid"></div>
    </div>

    <div id="view-history" class="view-section d-none">
        <div class="card p-4">
            <div class="row g-3 align-items-end mb-4">
                <div class="col-md-3">
                    <label class="form-label small text-muted">Start Date</label>
                    <div class="input-group">
                        <select class="form-select" id="hist-start-year"></select>
                        <select class="form-select" id="hist-start-month"></select>
                    </div>
                </div>
                <div class="col-md-3">
                    <label class="form-label small text-muted">End Date</label>
                    <div class="input-group">
                        <select class="form-select" id="hist-end-year"></select>
                        <select class="form-select" id="hist-end-month"></select>
                    </div>
                </div>
                <div class="col-md-3">
                    <label class="form-label small text-muted">Filter Team</label>
                    <select class="form-select" id="hist-team">
                        <option value="all">All Teams</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label d-block">&nbsp;</label>
                    <button class="btn btn-primary w-100" onclick="updateHistoryView()">Show History</button>
                </div>
            </div>

            <div class="row">
                <div class="col-md-8">
                    <div class="chart-container">
                        <canvas id="historyChart"></canvas>
                        <div class="chart-controls">
                            <button class="btn btn-chart-action" onclick="downloadHistoryCSV()"
                                    title="Download Data (CSV)"><i class="fas fa-file-csv"></i></button>
                            <button class="btn btn-chart-action" onclick="downloadChart('historyChart')"
                                    title="Download Chart (PNG)"><i class="fas fa-image"></i></button>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 table-responsive" style="max-height: 350px;">
                    <table class="table table-sm" id="historyTable">
                        <thead class="table-dark">
                        <tr>
                            <th>Team</th>
                            <th>Total Pts</th>
                        </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<script>
    // ================= CONFIGURATION =================
    const CSV_PATH = 'f1_data.csv';
    const COL_MAP = {
        season: 'Season',
        date: 'Date',
        constructor: 'ConstructorName',
        points: 'Points'
    };
    // =================================================

    let globalData = [];
    const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

    // Distinct colors for lines
    const colorPalette = [
        '#e10600', '#1f77b4', '#ff7f0e', '#2ca02c', '#d62728',
        '#9467bd', '#8c564b', '#e377c2', '#7f7f7f', '#bcbd22', '#17becf',
        '#000000', '#393b79', '#637939', '#8c6d31', '#843c39'
    ];

    document.addEventListener("DOMContentLoaded", () => {
        loadData();
    });

    // Helper: Make colors transparent
    function hexToRgba(hex, alpha) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function loadData() {
        Papa.parse(CSV_PATH, {
            download: true,
            header: true,
            skipEmptyLines: true,
            dynamicTyping: true,
            complete: function (results) {
                if (results.data && results.data.length > 0) {
                    globalData = results.data.map(row => ({
                        season: row[COL_MAP.season],
                        date: row[COL_MAP.date],
                        constructor: row[COL_MAP.constructor],
                        points: row[COL_MAP.points]
                    }));

                    if (globalData[0].season === undefined) {
                        alert("Error: Columns not found. Check COL_MAP in the code.");
                    } else {
                        document.getElementById('loading').classList.add('d-none');
                        initViews();
                        populateHistoryControls();
                    }
                } else {
                    alert("CSV file is empty.");
                }
            },
            error: function (err) {
                console.error(err);
                alert(`Failed to load CSV: ${err.message}`);
            }
        });
    }

    function initViews() {
        createDashboardPanel('single-panel-container', 0);
        setCompareCount(2);
    }

    function populateHistoryControls() {
        const teamSelect = document.getElementById('hist-team');
        const teams = [...new Set(globalData.map(d => d.constructor))].sort();
        teamSelect.innerHTML = '<option value="all">All Teams</option>' + teams.map(t => `<option value="${t}">${t}</option>`).join('');

        const years = [...new Set(globalData.map(d => d.season))].sort((a, b) => b - a);
        const yearOptions = years.map(y => `<option value="${y}">${y}</option>`).join('');

        document.getElementById('hist-start-year').innerHTML = yearOptions;
        document.getElementById('hist-end-year').innerHTML = yearOptions;
        document.getElementById('hist-start-year').value = years[years.length - 1];
        document.getElementById('hist-end-year').value = years[0];

        const monthOptions = months.map((m, i) => `<option value="${i}">${m}</option>`).join('');
        document.getElementById('hist-start-month').innerHTML = monthOptions;
        document.getElementById('hist-end-month').innerHTML = monthOptions;
        document.getElementById('hist-end-month').value = "11";
    }

    function switchView(viewName) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.add('d-none'));
        document.querySelectorAll('.btn-outline-light').forEach(el => el.classList.remove('active'));
        document.getElementById(`view-${viewName}`).classList.remove('d-none');
        document.getElementById(`btn-view-${viewName}`).classList.add('active');
    }

    function createDashboardPanel(containerId, uniqueId) {
        const container = document.getElementById(containerId);
        const uniqueSeasons = [...new Set(globalData.map(d => d.season))].sort().reverse();

        const html = `
            <div class="col-12 h-100">
                <div class="dashboard-panel">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <div class="btn-group btn-group-sm" role="group">
                            <input type="radio" class="btn-check" name="chartType-${uniqueId}" id="btn-bar-${uniqueId}" autocomplete="off" checked onchange="updatePanel(${uniqueId})">
                            <label class="btn btn-outline-secondary" for="btn-bar-${uniqueId}"><i class="fas fa-chart-bar"></i> Bar</label>

                            <input type="radio" class="btn-check" name="chartType-${uniqueId}" id="btn-line-${uniqueId}" autocomplete="off" onchange="updatePanel(${uniqueId})">
                            <label class="btn btn-outline-secondary" for="btn-line-${uniqueId}"><i class="fas fa-chart-line"></i> Line</label>
                        </div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-md-3"><select class="form-select" id="season-${uniqueId}" onchange="updatePanel(${uniqueId})">${uniqueSeasons.map(s => `<option value="${s}">${s}</option>`).join('')}</select></div>
                        <div class="col-md-3"><select class="form-select" id="month-${uniqueId}" onchange="updatePanel(${uniqueId})"><option value="all">All Months</option>${months.map((m, i) => `<option value="${i + 1}">${m}</option>`).join('')}</select></div>
                        <div class="col-md-4"><select class="form-select" id="team-${uniqueId}" onchange="updatePanel(${uniqueId})"><option value="all">All Teams</option></select></div>
                    </div>

                    <div class="row">
                        <div class="col-md-8">
                            <div class="chart-container">
                                <canvas id="chart-${uniqueId}"></canvas>
                                <div class="chart-controls">
                                    <button class="btn btn-chart-action" onclick="downloadCSV(${uniqueId})" title="Download Data (CSV)"><i class="fas fa-file-csv"></i></button>
                                    <button class="btn btn-chart-action" onclick="downloadChart('chart-${uniqueId}')" title="Download Chart (PNG)"><i class="fas fa-image"></i></button>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="table-responsive" style="height: 350px; overflow-y: auto;">
                                <table class="table table-sm text-center" id="table-${uniqueId}"><thead class="table-dark"><tr><th>#</th><th>Constructor</th><th>Pts</th></tr></thead><tbody></tbody></table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;

        if (containerId === 'comparison-grid') {
            const wrapper = document.createElement('div');
            wrapper.className = 'compare-slot';
            wrapper.innerHTML = html;
            container.appendChild(wrapper);
        } else {
            container.innerHTML = html;
        }
        updateTeamDropdown(uniqueId);
        updatePanel(uniqueId);
    }

    function setCompareCount(count) {
        document.getElementById('comparison-grid').innerHTML = '';
        for (let i = 1; i <= count; i++) createDashboardPanel('comparison-grid', i);
    }

    function updateTeamDropdown(id) {
        const season = document.getElementById(`season-${id}`).value;
        const teamSelect = document.getElementById(`team-${id}`);
        const teams = [...new Set(globalData.filter(d => d.season == season).map(d => d.constructor))].sort();
        teamSelect.innerHTML = '<option value="all">All Teams</option>' + teams.map(t => `<option value="${t}">${t}</option>`).join('');
    }

    function updatePanel(id) {
        const season = document.getElementById(`season-${id}`).value;
        const month = document.getElementById(`month-${id}`).value;
        const team = document.getElementById(`team-${id}`).value;
        const isLineChart = document.getElementById(`btn-line-${id}`).checked;

        let filtered = globalData.filter(d => d.season == season);
        if (month !== 'all') filtered = filtered.filter(d => (new Date(d.date).getMonth() + 1) == month);

        const standings = {};
        filtered.forEach(d => {
            const t = d.constructor;
            const p = parseFloat(d.points) || 0;
            standings[t] = (standings[t] || 0) + p;
        });

        let sorted = Object.keys(standings).map(k => ({
            team: k,
            points: standings[k]
        })).sort((a, b) => b.points - a.points);

        document.querySelector(`#table-${id} tbody`).innerHTML = sorted.map((s, i) =>
            `<tr class="${team === s.team ? 'table-warning fw-bold' : ''}"><td>${i + 1}</td><td>${s.team}</td><td>${s.points.toFixed(1)}</td></tr>`
        ).join('');
        document.getElementById(`table-${id}`).dataset.csvData = JSON.stringify(sorted);

        const ctx = document.getElementById(`chart-${id}`).getContext('2d');
        if (window[`chartInstance_${id}`]) window[`chartInstance_${id}`].destroy();

        if (isLineChart) {
            filtered.sort((a, b) => new Date(a.date) - new Date(b.date));
            const allDates = [...new Set(filtered.map(d => d.date))];

            let chartTeams = (team !== 'all') ? [team] : Object.keys(standings);

            const datasets = chartTeams.map((t, index) => {
                const color = colorPalette[index % colorPalette.length];
                let cumulative = 0;
                const pointsOverTime = allDates.map(date => {
                    const entries = filtered.filter(row => row.date === date && row.constructor === t);
                    const points = entries.reduce((sum, r) => sum + (parseFloat(r.points) || 0), 0);
                    cumulative += points;
                    return cumulative;
                });

                return {
                    label: t,
                    data: pointsOverTime,
                    borderColor: color,
                    backgroundColor: color,
                    fill: false,
                    tension: 0.1,
                    pointRadius: 4,      // Bigger dots for easier hovering
                    pointHoverRadius: 7, // Even bigger when hovered
                    borderWidth: 2.5,    // Slightly thicker lines to catch mouse
                    originalColor: color
                };
            });

            window[`chartInstance_${id}`] = new Chart(ctx, {
                type: 'line',
                data: {labels: allDates, datasets: datasets},
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    // --- UPDATED INTERACTION ---
                    interaction: {
                        mode: 'dataset',   // Highlights whole line
                        intersect: true,   // MUST touch the line/dot to trigger
                        axis: 'xy'
                    },
                    plugins: {
                        title: {display: true, text: `Championship Battle (${season})`},
                        tooltip: {
                            mode: 'nearest', // Show tooltip for closest point
                            intersect: true  // ONLY when touching the dot
                        }
                    },
                    onHover: (event, activeElements, chart) => {
                        if (!chart.lastHoveredIndex) chart.lastHoveredIndex = -1;
                        let newIndex = -1;
                        if (activeElements.length > 0) newIndex = activeElements[0].datasetIndex;

                        if (chart.lastHoveredIndex !== newIndex) {
                            const ds = chart.data.datasets;
                            if (newIndex !== -1) {
                                ds.forEach((d, i) => {
                                    if (i === newIndex) {
                                        d.borderColor = d.originalColor;
                                        d.borderWidth = 5; // Very thick highlight
                                    } else {
                                        d.borderColor = hexToRgba(d.originalColor, 0.15); // Fade
                                        d.borderWidth = 1;
                                    }
                                });
                            } else {
                                // Reset instantly when leaving line
                                ds.forEach(d => {
                                    d.borderColor = d.originalColor;
                                    d.borderWidth = 2.5;
                                });
                            }
                            chart.update();
                            chart.lastHoveredIndex = newIndex;
                        }
                    }
                }
            });

        } else {
            const chartColors = sorted.map(s => (team !== 'all' && s.team !== team) ? '#e0e0e0' : '#e10600');
            window[`chartInstance_${id}`] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: sorted.map(s => s.team),
                    datasets: [{label: 'Points', data: sorted.map(s => s.points), backgroundColor: chartColors}]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: {legend: {display: false}, title: {display: true, text: `${season} Standings`}}
                }
            });
        }
    }

    // --- HISTORY LOGIC ---
    function updateHistoryView() {
        const startYear = parseInt(document.getElementById('hist-start-year').value);
        const startMonth = parseInt(document.getElementById('hist-start-month').value);
        const endYear = parseInt(document.getElementById('hist-end-year').value);
        const endMonth = parseInt(document.getElementById('hist-end-month').value);
        const selectedTeam = document.getElementById('hist-team').value;

        const startDate = new Date(startYear, startMonth, 1);
        const endDate = new Date(endYear, endMonth + 1, 0);

        if (endDate < startDate) return alert("End date cannot be before start date.");

        let filtered = globalData.filter(d => {
            const date = new Date(d.date);
            return date >= startDate && date <= endDate;
        });

        if (selectedTeam !== 'all') filtered = filtered.filter(d => d.constructor === selectedTeam);

        const standings = {};
        filtered.forEach(d => standings[d.constructor] = (standings[d.constructor] || 0) + (parseFloat(d.points) || 0));

        let sorted = Object.keys(standings).map(k => ({
            team: k,
            points: standings[k]
        })).sort((a, b) => b.points - a.points);
        if (selectedTeam === 'all') sorted = sorted.slice(0, 15);

        document.querySelector('#historyTable tbody').innerHTML = sorted.map(s => `<tr><td>${s.team}</td><td>${s.points.toFixed(1)}</td></tr>`).join('');
        document.getElementById('historyTable').dataset.csvData = JSON.stringify(sorted);

        if (window.historyChartInstance) window.historyChartInstance.destroy();

        const startStr = months[startMonth] + " " + startYear;
        const endStr = months[endMonth] + " " + endYear;

        window.historyChartInstance = new Chart(document.getElementById('historyChart'), {
            type: 'bar',
            data: {
                labels: sorted.map(s => s.team),
                datasets: [{label: 'Total Points', data: sorted.map(s => s.points), backgroundColor: '#e10600'}]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: {title: {display: true, text: `History: ${startStr} - ${endStr}`}}
            }
        });
    }

    function downloadChart(canvasId) {
        const canvas = document.getElementById(canvasId);
        const link = document.createElement('a');
        link.download = 'f1-chart.png';
        link.href = canvas.toDataURL();
        link.click();
    }

    function downloadCSV(id) {
        const rawData = document.getElementById(`table-${id}`).dataset.csvData;
        if (!rawData) return alert("No data to export");
        triggerCSVDownload(JSON.parse(rawData));
    }

    function downloadHistoryCSV() {
        const rawData = document.getElementById('historyTable').dataset.csvData;
        if (!rawData) return alert("No history data to export. Click 'Show History' first.");
        triggerCSVDownload(JSON.parse(rawData));
    }

    function triggerCSVDownload(data) {
        const csvContent = "data:text/csv;charset=utf-8,"
            + "Rank,Constructor,Points\n"
            + data.map((row, index) => `${index + 1},${row.team},${row.points}`).join("\n");

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "f1_data_export.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>
